name: News aggregator

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print previews; never contact Telegram"
        required: true
        type: boolean
        default: true
      run_mode:
        description: "Choose a release or editor commands"
        type: choice
        default: auto
        options: [auto, news, digest, quote, emergency, weekly, editor]
  schedule:
    - cron: "17 5,17 * * *"
    - cron: "17 7,9,11,13,15,19 * * *"
    - cron: "47 * * * *"
    - cron: "32 18 * * 0"
    - cron: "32 11 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-news-aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TNEWS_AGGREGATOR_BOT }}
      TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@GVOZDIchKAAA' }}
      REVIEW_CHAT_ID: ${{ secrets.REVIEW_CHAT_ID }}
      EDITOR_CHAT_ID: ${{ secrets.EDITOR_CHAT_ID }}
      REVIEW_UNCERTAIN: ${{ vars.REVIEW_UNCERTAIN || 'true' }}
      NEWS_MAX_AGE_HOURS: ${{ vars.NEWS_MAX_AGE_HOURS || '48' }}
      RUN_MODE: ${{ inputs.run_mode || 'auto' }}
      REVIEW_MODE: ${{ vars.REVIEW_MODE || 'true' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gpt-4.1-mini' }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MAX_ITEMS_PER_RUN: ${{ vars.MAX_ITEMS_PER_RUN || '1' }}
      DAILY_POST_LIMIT: ${{ vars.DAILY_POST_LIMIT || '10' }}
      POST_TIMEZONE: ${{ vars.POST_TIMEZONE || 'Europe/Moscow' }}
      STATE_DB: data/state.db

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select safe run mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "DRY_RUN=true" >> "$GITHUB_ENV"
          else
            echo "DRY_RUN=false" >> "$GITHUB_ENV"
          fi

      - name: Restore durable state
        shell: bash
        run: |
          mkdir -p data
          git fetch origin state || true
          if git rev-parse --verify origin/state >/dev/null 2>&1; then
            git show origin/state:data/state.db > data/state.db || true
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Verify Telegram bot access
        run: python -m scripts.check_telegram_access

      - name: Aggregate
        shell: bash
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            if [[ -f data/state.db ]]; then cp data/state.db /tmp/dry-run.db; fi
          fi
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run --state /tmp/dry-run.db); fi
          mode="$RUN_MODE"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            case "${{ github.event.schedule }}" in
              "32 18 * * 0") mode=weekly ;;
              "47 * * * *") mode=emergency ;;
              "17 5,17 * * *") mode=digest ;;
              "32 11 * * *") mode=quote ;;
              *) mode=news ;;
            esac
          fi
          case "$mode" in
            weekly) args+=(--weekly-digest) ;;
            emergency) args+=(--emergency-only --max-items 1) ;;
            digest) args+=(--digest --max-items 2) ;;
            quote) args+=(--quote-of-day --max-items 1) ;;
            editor) args+=(--process-editor-messages) ;;
          esac
          python main.py "${args[@]}"

      - name: Persist state branch
        if: success() && env.DRY_RUN != 'true'
        shell: bash
        run: |
          cp data/state.db /tmp/telegram-news-state.db
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan state-write
          mkdir -p data
          cp /tmp/telegram-news-state.db data/state.db
          git add -f data/state.db
          git commit -m "Update aggregator state [skip ci]"
          git push --force origin HEAD:state
